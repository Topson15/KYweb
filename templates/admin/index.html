{% extends "admin/base.html" %}
{% block body %}
<h1>总览</h1>
<div class="stats">
  <div>用户 {{ stats.users }}</div>
  <div>条目 {{ stats.listings }}</div>
  <div>待审 {{ stats.pending }}</div>
  <div>广告 {{ stats.ads }}</div>
</div>
<h2>待审核</h2>
{% for p in pending %}
  <div class="row">
    <span>{{ p.title }}</span>
    <form method="post" action="{{ url_for('admin_listing_action', item_id=p.id, action='approve') }}"><button>通过</button></form>
    <form method="post" action="{{ url_for('admin_listing_action', item_id=p.id, action='reject') }}"><button>拒绝</button></form>
  </div>
{% else %}
  <p class="empty">没有待审条目</p>
{% endfor %}
<form method="post" action="{{ url_for('admin_reload_demo') }}" onsubmit="return confirm('将清空分类/条目/广告并写入加厚演示数据，账号保留。确定？')">
  <p class="hint">已经跑过旧版数据库的，点下面按钮才能看到加厚内容。</p>
  <button class="btn" type="submit">重新载入加厚演示内容</button>
</form>
{% endblock %}
