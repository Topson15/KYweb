{% extends "admin/base.html" %}
{% block body %}
<h1>分类与二级介绍</h1>
<form method="post" class="form">
  <label>上级
    <select name="parent_id">
      <option value="">作为一级分类</option>
      {% for p in parents %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
    </select>
  </label>
  <label>名称 <input name="name" required></label>
  <label>slug <input name="slug" required></label>
  <label>介绍文案 <textarea name="intro" rows="3"></textarea></label>
  <label>排序 <input name="sort_order" type="number" value="0"></label>
  <button class="btn" type="submit">新增分类</button>
</form>
<table>
  <tr><th>ID</th><th>名称</th><th>slug</th><th>上级</th><th>介绍</th><th></th></tr>
  {% for r in rows %}
  <tr>
    <td>{{ r.id }}</td><td>{{ r.name }}</td><td>{{ r.slug }}</td>
    <td>{{ r.parent_id or '一级' }}</td>
    <td>{{ r.intro[:40] }}</td>
    <td>
      <form method="post" action="{{ url_for('admin_cat_delete', cid=r.id) }}"><button>删</button></form>
    </td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
